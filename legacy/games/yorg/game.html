<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tile-Based Game</title>
</head>
<body>

    <canvas id="canvas"></canvas>

    <button id="build-button">Build</button>

    <div id="ribbon"></div>

    <div id="menu">
        <button id="close-button">Close</button>
        <button class="node-button" data-node="crystal_node">Crystal</button>
        <button class="node-button" data-node="wood_node">Wood</button>
        <button class="node-button" data-node="iron_node">Iron</button>
        <button class="node-button" data-node="diamond_node">Diamond</button>
        <button class="node-button" data-node="uranium_node">Uranium</button>
    </div>

    <script src="main.js"></script>
    <script src="button.js"></script>
</body>
</html>
