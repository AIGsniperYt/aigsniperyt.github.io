<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving a Character</title>
    <style>
        body {
            background-color: #333;
        }

        #player {
            width: 50px;
            height: 50px;
            background-color: #98FF98;
            border-radius: 50%;
            position: absolute;
        }

        .backlinks {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .backlinks a {
            text-decoration: none;
            color: #98FF98;
            margin: 5px;
            transition: color 0.3s;
        }

        .backlinks a:hover {
            color: #77CC77;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        const player = document.getElementById("player");

        let x = 0;
        let y = 0;

        // Create boolean flags to track key states
        let isWPressed = false;
        let isSPressed = false;
        let isAPressed = false;
        let isDPressed = false;

        function updatePosition() {
            player.style.left = x + "px";
            player.style.top = y + "px";
        }

        // Event listeners for keydown and keyup events
        document.addEventListener("keydown", (event) => {
            if (event.key === "ArrowUp" || event.key === "W" || event.key === "w") {
                isWPressed = true;
            }
            if (event.key === "ArrowDown" || event.key === "S" || event.key === "s") {
                isSPressed = true;
            }
            if (event.key === "ArrowLeft" || event.key === "A" || event.key === "a") {
                isAPressed = true;
            }
            if (event.key === "ArrowRight" || event.key === "D" || event.key === "d") {
                isDPressed = true;
            }
        });

        document.addEventListener("keyup", (event) => {
            if (event.key === "ArrowUp" || event.key === "W" || event.key === "w") {
                isWPressed = false;
            }
            if (event.key === "ArrowDown" || event.key === "S" || event.key === "s") {
                isSPressed = false;
            }
            if (event.key === "ArrowLeft" || event.key === "A" || event.key === "a") {
                isAPressed = false;
            }
            if (event.key === "ArrowRight" || event.key === "D" || event.key === "d") {
                isDPressed = false;
            }
        });

        function movePlayer() {
            // Adjust the speed by changing these values
            const speed = 4; // You can change this number to make it faster or slower

            // Check key flags and update position
            if (isWPressed) {
                y -= speed;
            }
            if (isSPressed) {
                y += speed;
            }
            if (isAPressed) {
                x -= speed;
            }
            if (isDPressed) {
                x += speed;
            }

            updatePosition();

            // Request the next animation frame to continue the loop
            requestAnimationFrame(movePlayer);
        }

        movePlayer()

    </script>
    <div class="backlinks">
        <a href="../../index.html">Back to Landing Page</a>
        <a href="../../../index.html">Back to Portfolio</a>
    </div>
</body>
</html>
