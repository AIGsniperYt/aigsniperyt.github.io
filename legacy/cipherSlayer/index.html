<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decipher Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <!-- Side Menu -->
        <div id="sideMenu">
            <h2>Tools</h2>
            <button class="toolButton" onclick="reverseWordOrder()">Reverse Word Order</button>
            <button class="toolButton" onclick="applyCaesarShift()">Apply Caesar Shift</button>
            <!-- Add more buttons as needed -->
        </div>

        <!-- Main Content -->
        <div id="mainContent">
            <p id="scrambleText">Loading...</p>
            <textarea id="cipherInput" placeholder="Enter your encrypted text here..."></textarea>
            <button id="decipherButton">Input</button>
            <div id="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
