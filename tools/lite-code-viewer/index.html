<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Code Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #070d0a;
            --panel: #0d1611;
            --panel2: #111d16;
            --border: #1c2e23;
            --text: #e8f5ee;
            --muted: #8ba79a;
            --emerald: #4cff9a;
            --emerald-dim: #2fa265;
            --ln: #2e4a3b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
        }
        header h1 { font-size: 1.02rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        header h1 span { color: var(--emerald); }
        header .actions { display: flex; gap: 10px; align-items: center; }
        header .actions a {
            color: var(--emerald);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 999px;
            transition: background 0.15s ease;
        }
        header .actions a:hover { background: rgba(76,255,154,0.08); }
        #copyBtn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        #copyBtn:hover { color: var(--emerald); border-color: var(--emerald-dim); }
        #copyBtn.copied { color: var(--emerald); border-color: var(--emerald); }
        .layout { display: flex; flex: 1; min-height: 0; }
        aside {
            width: 240px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: var(--panel);
            padding: 12px 0;
            overflow-y: auto;
        }
        aside .file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.84rem;
            color: var(--muted);
            border-left: 2px solid transparent;
            transition: background 0.12s ease, color 0.12s ease;
            font-family: Consolas, "Courier New", monospace;
            word-break: break-all;
        }
        aside .file:hover { background: var(--panel2); color: var(--text); }
        aside .file.active { background: var(--panel2); color: var(--emerald); border-left-color: var(--emerald); }
        aside .file .ln { margin-left: auto; font-size: 0.7rem; color: var(--ln); flex-shrink: 0; }
        aside .file.err { color: #ff8585; }
        main { flex: 1; overflow: auto; background: var(--bg); position: relative; }
        pre {
            padding: 16px 20px;
            font-family: "Cascadia Code", Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.55;
            tab-size: 4;
            white-space: pre;
        }
        pre .line { display: flex; }
        pre .num {
            width: 44px;
            flex-shrink: 0;
            text-align: right;
            padding-right: 16px;
            color: var(--ln);
            user-select: none;
            font-size: 12px;
        }
        pre .txt { color: var(--text); white-space: pre; }
        pre .c  { color: #5c8a76; font-style: italic; }
        pre .s  { color: #8cd98c; }
        pre .n  { color: #e0a45f; }
        pre .k  { color: #c9a7ff; font-weight: 500; }
        .loading, .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            height: 100%;
            min-height: 60vh;
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }
        .loading i { font-size: 2rem; color: var(--emerald); }
        .empty code { background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 8px; color: var(--emerald); font-size: 0.85rem; }
        @media (max-width: 640px) {
            .layout { flex-direction: column; }
            aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; max-height: 40vh; }
            aside .file { padding: 8px 12px; }
            aside .file .ln { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="title">Lite <span>Code Viewer</span></h1>
        <div class="actions">
            <button id="copyBtn" title="Copy current file" hidden>Copy</button>
            <a href="../../index.html">Portfolio</a>
        </div>
    </header>
    <div class="layout">
        <aside id="files"></aside>
        <main id="codePane"></main>
    </div>
    <script>
        const filesEl = document.getElementById("files");
        const pane = document.getElementById("codePane");
        const copyBtn = document.getElementById("copyBtn");
        const titleEl = document.getElementById("title");
        const KEYWORDS = new Set(["break","case","catch","class","const","continue","debugger","default","delete","do","else","enum","export","extends","finally","for","function","if","import","in","instanceof","let","new","return","super","switch","this","throw","try","typeof","var","void","while","with","yield","async","await","of","static","get","set","def","elif","lambda","global","pass","raise","False","True","None","and","or","not","is","null","undefined"]);
        const icons = { ".py": "fa-python", ".json": "fa-braces", ".md": "fa-file-lines", ".html": "fa-code", ".js": "fa-code", ".css": "fa-paintbrush" };

        const params = new URLSearchParams(location.search);
        const fileList = (params.get("files") || "").split(",").map(s => s.trim()).filter(Boolean);
        const titleRaw = params.get("title") || "";

        const BASE = (() => {
            const parts = location.pathname.split("/").filter(Boolean);
            parts.pop(); parts.pop(); parts.pop();
            return parts.length ? "/" + parts.join("/") + "/" : "/";
        })();

        let files = [];      // {path, src, ok, err}
        let current = 0;

        if (!fileList.length) {
            titleEl.innerHTML = "Lite <span>Code Viewer</span>";
            pane.innerHTML = '<div class="empty"><i class="fa-solid fa-code"></i><div>No files requested.</div><div>Open a deprecated project\'s source via the portfolio card.</div></div>';
        }

        function esc(t) {
            return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function lineCount(src) {
            let n = 1;
            for (const ch of src) if (ch === "\n") n++;
            return n;
        }

        function highlight(src, ext) {
            const isPy = ext === "py" || ext === "md";
            let re;
            if (isPy) {
                re = /(\/\/.*$|#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\d+(?:\.\d+)?)|([A-Za-z_$][\w$]*)/g;
            } else {
                re = /(\/\/.*$|\/\*.*$|<!--.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\d+(?:\.\d+)?)|([A-Za-z_$][\w$]*)/g;
            }
            let out = "", last = 0, m;
            while ((m = re.exec(src))) {
                out += esc(src.slice(last, m.index));
                if (m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
                else if (m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
                else if (m[3]) out += '<span class="n">' + esc(m[3]) + '</span>';
                else if (m[4]) out += KEYWORDS.has(m[4]) ? '<span class="k">' + esc(m[4]) + '</span>' : esc(m[4]);
                last = m.index + m[0].length;
            }
            out += esc(src.slice(last));
            return out;
        }

        function renderSidebar() {
            filesEl.innerHTML = "";
            files.forEach((f, i) => {
                const div = document.createElement("div");
                div.className = "file" + (i === current ? " active" : "") + (f.ok ? "" : " err");
                const ext = f.path.split(".").pop();
                div.innerHTML = '<i class="fa-solid ' + (icons["." + ext] || "fa-file") + '"></i><span>' + f.path.split("/").pop() + '</span>';
                if (f.ok) div.innerHTML += '<span class="ln">' + lineCount(f.src) + '</span>';
                div.addEventListener("click", () => { current = i; render(); });
                filesEl.appendChild(div);
            });
        }

        function render() {
            renderSidebar();
            const f = files[current];
            if (!f) return;
            copyBtn.hidden = !f.ok;
            if (!f.ok) {
                pane.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><div>Could not load ' + esc(f.path) + '</div></div>';
                return;
            }
            const ext = f.path.split(".").pop();
            const lines = f.src.split("\n");
            let html = '<pre>';
            for (let i = 0; i < lines.length; i++) {
                html += '<div class="line"><span class="num">' + (i + 1) + '</span><span class="txt">' + highlight(lines[i], ext) + '</span></div>';
            }
            html += "</pre>";
            pane.innerHTML = html;
            pane.scrollTop = 0;
        }

        copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(files[current].src).then(() => {
                copyBtn.textContent = "Copied!";
                copyBtn.classList.add("copied");
                setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 1400);
            });
        });

        async function load() {
            if (!fileList.length) return;
            if (titleRaw) titleEl.textContent = titleRaw;
            pane.innerHTML = '<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i><div>Loading source…</div></div>';
            files = await Promise.all(fileList.map(async (path) => {
                try {
                    const res = await fetch(BASE + path, { cache: "no-store" });
                    if (!res.ok) throw new Error(res.status);
                    return { path, src: await res.text(), ok: true };
                } catch (e) {
                    return { path, src: "", ok: false, err: String(e) };
                }
            }));
            current = 0;
            render();
        }
        load();
    </script>
</body>
</html>
