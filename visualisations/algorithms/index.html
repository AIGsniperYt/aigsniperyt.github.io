<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting and Searching Algorithms Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="controls">
        <label for="dataSize">Number of Bars:</label>
        <input type="number" id="dataSize" value="100" min="10" max="200">

        <label for="speed">Speed (ms):</label>
        <input type="number" id="speed" value="50" min="1">

        <button id="reroll">Reroll Data</button>
        <button id="startSort">Start Sorting</button>
        <select id="algorithm">
            <option value="bubble">Bubble Sort</option>
            <option value="selection">Selection Sort</option>
            <option value="insertion">Insertion Sort</option>
            <option value="quick">Quick Sort</option>
        </select>
    </div>
    <canvas id="canvas" width="800" height="400"></canvas>
    <div id="stats">
        <p>Comparisons: <span id="comparisons">0</span></p>
        <p>Swaps: <span id="swaps">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
